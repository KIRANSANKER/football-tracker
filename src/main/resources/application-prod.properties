# ===============================
# PRODUCTION CONFIGURATION (Railway)
# ===============================

# Server (Railway auto PORT)
server.port=${PORT:8080}

# MySQL - Railway Database
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Prod)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update


