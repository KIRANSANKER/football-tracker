# =============================================
# Football Tracker - Application Configuration
# =============================================

# Server
server.port=${PORT:8080}

# MySQL DataSource
# Uses Railway variables in cloud
# Falls back to localhost when running locally
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:football_tracker}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:KIRANSANKER}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Jackson - handle Java 8 date/time
spring.jackson.serialization.write-dates-as-timestamps=false